services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arya_noble
    ports:
      - "50010:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d arya_noble" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/arya_noble
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10m
    volumes:
      - ./backend:/app
      - ./.hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  mock-cis:
    build:
      context: ./mock-cis
    ports:
      - "8001:8001"
    environment:
      - BACKEND_WEBHOOK_URL=http://backend:8000/api/webhooks/cis
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app" ]
    volumes:
      - ./mock-cis/main.py:/app/main.py
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
