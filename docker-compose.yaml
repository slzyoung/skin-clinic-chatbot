services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arya_noble
    ports:
      - "50010:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/arya_noble
    depends_on:
      - db
      - mock-cis
    volumes:
      - ./backend:/app
      - ./.hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  mock-cis:
    build:
      context: ./mock-cis
    ports:
      - "8001:8001"
    environment:
      - BACKEND_WEBHOOK_URL=http://backend:8000/api/webhooks/cis
    volumes:
      - ./mock-cis:/app

volumes:
  pgdata:
